# HERALD Configuration
# Thresholds and model settings

tier1:
  model_name: "cross-encoder/nli-deberta-v3-large"  # Public, no HF auth required
  # model_name: "microsoft/deberta-v3-large-mnli"   # Requires HF login (hf auth login)
  # model_name: "models/deberta-finetuned"           # Phase 2: after fine-tuning
  device: "cpu"  # "cuda" if you have a GPU, "mps" for Apple Silicon

tier2:
  model: "llama-3.3-70b-versatile"  # Groq free tier

tier3:
  model: "llama-3.3-70b-versatile"  # Same model, 3 calls (advocate/critic/judge)

thresholds:
  T1: 0.70  # Tier 1 → Tier 2 escalation (start here, tune later)
  T2: 0.80  # Tier 2 → Tier 3 escalation

# Tier 2.5: Counterfactual probe
# Addresses correlated model bias: after a confident Tier 2 verdict, asks the
# model what disconfirming evidence would look like, then checks for it in source.
# If found, overrides verdict to UNCERTAIN and escalates to Tier 3.
# Set enabled: false when running large batches to conserve Groq rate limit quota.
counterfactual_probe:
  enabled: true
  model: "llama-3.3-70b-versatile"  # Can use a different model to reduce correlation

# Phase 0: Task analysis settings
# Uses a lighter Claude model to analyze the task before execution.
task_analysis:
  enabled: true
  model: "claude-sonnet-4-20250514"  # Cheaper than Opus; sufficient for structural analysis

# Phase 2: Batch validation settings
batch_validation:
  max_concurrent_tier1: 50           # How many NLI calls to run (currently sequential)
  escalation_sample_rate: 1.0        # Validate all escalated cases (set <1.0 to sample)
  tier1_confidence_threshold: 0.70   # Mirrors thresholds.T1; override here for batch mode

# Checkpoint routing rules
# These govern how the BatchValidator routes outputs to different pipeline paths.
checkpoint_routing:
  # Checkpoint types where Tier 1 NLI is unreliable — route directly to Tier 2
  # NLI cannot assess causal attribution strength or epistemic hedge preservation
  skip_nli: ["causal", "epistemic"]
  # Checkpoint types that benefit from multi-agent debate (adversarial framing helps)
  prefer_debate: ["causal", "synthesis"]
  # Checkpoint types where NLI alone is sufficient if confident
  nli_sufficient: ["retrieval", "claim_extraction", "numerical"]
