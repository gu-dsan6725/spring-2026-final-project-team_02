# HERALD Configuration

# Provider: "gemini", "groq", or "openai"
# gemini-2.0-flash: 1M tokens/day free, strong reasoning, no rate limit issues
# groq llama-3.3-70b-versatile: 100k tokens/day, decommissioned models reduced options
# openai gpt-4o-mini: reliable JSON output, uses OPENAI_API_KEY
provider: "gemini"

tier1:
  model_name: "cross-encoder/nli-deberta-v3-large"
  device: "cpu"  # "cuda" if you have a GPU, "mps" for Apple Silicon

tier2:
  model: "gemma-3-27b-it"   # used when provider: gemini (14,400 RPD free tier)
  # model: "llama-3.3-70b-versatile"  # used when provider: groq
  # model: "gpt-4o-mini"  # used when provider: openai

tier3:
  model: "gemma-3-27b-it"   # 3 calls per debate (advocate/critic/judge)
  # model: "llama-3.3-70b-versatile"
  # model: "gpt-4o-mini"

thresholds:
  T1: 0.70  # Tier 1 → Tier 2 escalation (global default)
  T2: 0.80  # Tier 2 → Tier 3 escalation

  # Per-type T1 overrides — applied instead of T1 for matching checkpoint types.
  # Higher thresholds force more escalation to T2 for types where NLI is
  # unreliable. Note: these are only meaningful for types NOT in skip_nli
  # (skip_nli suppresses T1 resolution entirely, making the threshold moot).
  # Use these for types like numerical/synthesis that aren't fully skipped but
  # still benefit from a stricter confidence bar before T1 can resolve.
  T1_by_type:
    numerical: 0.85   # Wrong numbers get high entailment scores — demand more certainty
    synthesis: 0.85   # Multi-claim outputs are harder for NLI to score holistically

# Tier 2.5: Counterfactual probe
# Addresses correlated model bias: after a confident Tier 2 verdict, asks the
# model what disconfirming evidence would look like, then checks for it in source.
# If found, overrides verdict to UNCERTAIN and escalates to Tier 3.
# Set enabled: false when running large batches to save API quota.
counterfactual_probe:
  enabled: true
  # model: "gemini-2.0-flash"  # Optional: override to a different model to reduce correlation bias.
  #                               Defaults to the tier2 model when omitted.

# Phase 0: Task analysis settings
# Uses a lighter Claude model to analyze the task before execution.
task_analysis:
  enabled: true
  model: "claude-sonnet-4-20250514"  # Cheaper than Opus; sufficient for structural analysis

# Phase 2: Batch validation settings
batch_validation:
  max_concurrent_tier1: 50           # How many NLI calls to run (currently sequential)
  escalation_sample_rate: 1.0        # Validate all escalated cases (set <1.0 to sample)
  tier1_confidence_threshold: 0.70   # Mirrors thresholds.T1; override here for batch mode

# Checkpoint routing rules
# These govern how the BatchValidator routes outputs to different pipeline paths.
checkpoint_routing:
  # Checkpoint types where Tier 1 NLI is unreliable — route directly to Tier 2
  # NLI cannot assess causal attribution strength or epistemic hedge preservation
  skip_nli: ["causal", "epistemic"]
  # Checkpoint types that benefit from multi-agent debate (adversarial framing helps)
  prefer_debate: ["causal", "synthesis"]
  # Checkpoint types where NLI alone is sufficient if confident
  nli_sufficient: ["retrieval", "claim_extraction", "numerical"]
