# ============================================================================
# Local development services
# ============================================================================
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v  (destroys data)
# Logs:   docker compose logs -f postgres
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: policy-memo-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: policy_memo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: policy-memo-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: policy-memo-backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/policy_memo
      REDIS_URL: redis://redis:6379
      BRAINTRUST_API_KEY: ${BRAINTRUST_API_KEY:-}
      BRAINTRUST_PROJECT_NAME: ${BRAINTRUST_PROJECT_NAME:-policy-memo-agent}
      HF_MODEL_PATH: ${HF_MODEL_PATH:-microsoft/deberta-v3-large-mnli}
      NLI_ONNX_MODEL_PATH: ${NLI_ONNX_MODEL_PATH:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Cache HuggingFace model downloads between restarts
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
  redisdata:
  hf_cache:
