[project]
name = "herald"
version = "0.1.0"
description = "Hierarchical Escalation for Reliable Agentic LLM Decision-making"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "groq>=0.11.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.2.0",
    "google-genai>=1.70.0",
    "openai>=1.0.0",
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "mcp[cli]>=1.0.0",
    "google-generativeai>=0.8.6",
]

[project.scripts]
herald-run = "herald.pipeline.run:main"
herald-eval = "herald.evaluation.evaluate:main"
herald-feasibility = "herald.notebooks.feasibility_check:main"
herald-agent = "herald.agent.agent:main"
herald-research = "herald.agent.research_agent:main"
herald-mcp = "herald.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pre-commit>=4.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/herald"]
