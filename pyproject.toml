[project]
name = "herald"
version = "0.1.0"
description = "Hierarchical Escalation for Reliable Agentic LLM Decision-making"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "groq>=0.11.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
herald-run = "herald.pipeline.run:main"
herald-eval = "herald.evaluation.evaluate:main"
herald-feasibility = "herald.notebooks.feasibility_check:main"
herald-agent = "herald.agent.agent:main"
herald-research = "herald.agent.research_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herald"]
